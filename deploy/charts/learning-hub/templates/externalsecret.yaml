{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "learning-hub.fullname" . }}
  labels:
    {{- include "learning-hub.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.existingSecret.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $secretKey, $remoteKey := .Values.externalSecret.data }}
    - secretKey: {{ $secretKey }}
      remoteRef:
        key: {{ $remoteKey | quote }}
    {{- end }}
{{- end }}
