{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "learning-hub.fullname" . }}
  labels:
    {{- include "learning-hub.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "65"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service: {name: learning-hub-keycloak, port: {name: http}}
          - path: /api
            pathType: Prefix
            backend:
              service: {name: {{ include "learning-hub.fullname" . }}-api, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "learning-hub.fullname" . }}-web, port: {name: http}}
{{- end }}
