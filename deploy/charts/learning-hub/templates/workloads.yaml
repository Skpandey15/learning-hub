{{- $root := . -}}
{{- range $component, $settings := dict
  "api" (dict "image" .Values.images.api "port" 8080 "uid" 10001 "live" "/actuator/health/liveness" "ready" "/actuator/health/readiness" "resources" .Values.resources.api)
  "ai-service" (dict "image" .Values.images.aiService "port" 8000 "uid" 10001 "live" "/health/live" "ready" "/health/ready" "resources" .Values.resources.aiService)
  "web" (dict "image" .Values.images.web "port" 8080 "uid" 101 "live" "/health" "ready" "/health" "resources" .Values.resources.web)
}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "learning-hub.fullname" $root }}-{{ $component }}
  labels:
    {{- include "learning-hub.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ if $root.Values.autoscaling.enabled }}{{ $root.Values.autoscaling.minReplicas }}{{ else }}{{ index $root.Values.replicaCount (camelcase $component) | default 2 }}{{ end }}
  revisionHistoryLimit: {{ $root.Values.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "learning-hub.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "learning-hub.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include (print $root.Template.BasePath "/configmap.yaml") $root | sha256sum }}
    spec:
      serviceAccountName: {{ include "learning-hub.serviceAccountName" $root }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ $root.Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- include "learning-hub.podSecurityContext" $root | nindent 8 }}
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if $root.Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $root.Release.Name }}
              app.kubernetes.io/component: {{ $component }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $root.Release.Name }}
              app.kubernetes.io/component: {{ $component }}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: {{ required (printf "images.%s digest is required" $component) $settings.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "learning-hub.containerSecurityContext" $root | nindent 12 }}
            runAsUser: {{ $settings.uid }}
            runAsGroup: {{ $settings.uid }}
          ports:
            - name: http
              containerPort: {{ $settings.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "learning-hub.fullname" $root }}
          {{- if eq $component "api" }}
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret.name }}, key: {{ $root.Values.existingSecret.keys.postgresUser }}}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret.name }}, key: {{ $root.Values.existingSecret.keys.postgresPassword }}}}
            - name: INTERNAL_AI_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret.name }}, key: {{ $root.Values.existingSecret.keys.internalServiceToken }}}}
            - name: AUDIT_IP_HASH_SALT
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret.name }}, key: {{ $root.Values.existingSecret.keys.auditIpHashSalt }}}}
          {{- else if eq $component "ai-service" }}
          env:
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret.name }}, key: {{ $root.Values.existingSecret.keys.internalServiceToken }}}}
            - name: LITELLM_API_KEY
              valueFrom: {secretKeyRef: {name: {{ $root.Values.existingSecret.name }}, key: {{ $root.Values.existingSecret.keys.litellmApiKey }}}}
          {{- end }}
          startupProbe:
            httpGet: {path: {{ $settings.ready }}, port: http}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: {{ $settings.live }}, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: {{ $settings.ready }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if eq $component "web" }}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        {{- if eq $component "web" }}
        - name: nginx-cache
          emptyDir: {sizeLimit: 64Mi}
        - name: nginx-run
          emptyDir: {sizeLimit: 16Mi}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "learning-hub.fullname" $root }}-{{ $component }}
  labels:
    {{- include "learning-hub.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "learning-hub.name" $root }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - {name: http, port: {{ $settings.port }}, targetPort: http, protocol: TCP}
{{- end }}
