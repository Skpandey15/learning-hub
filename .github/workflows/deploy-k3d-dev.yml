name: Deploy k3d development

on:
  workflow_run:
    workflows: [Release]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-k3d-development
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64, k3d-dev]
    timeout-minutes: 20
    environment:
      name: development
      url: https://${{ vars.DEV_INGRESS_HOST }}:8443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Download attested release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.event.workflow_run.head_sha }}
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify local deployment prerequisites
        shell: pwsh
        run: |
          if ((kubectl config current-context) -ne 'k3d-dev') { throw 'Runner is not targeting k3d-dev' }
          kubectl get secret learning-hub-runtime -n learning-hub-development | Out-Null
          kubectl get secret '${{ vars.DEV_INGRESS_TLS_SECRET }}' -n learning-hub-development | Out-Null
      - name: Reconcile development platform
        shell: pwsh
        run: |
          kubectl create configmap keycloak-realm -n learning-hub-development `
            --from-file=learning-hub-realm.json=platform/keycloak/learning-hub-realm.json `
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deploy/k3d-dev/platform.yaml
          kubectl rollout status deployment/learning-hub-postgres -n learning-hub-development --timeout=5m
          kubectl rollout status deployment/learning-hub-keycloak -n learning-hub-development --timeout=8m
          kubectl rollout status deployment/learning-hub-litellm -n learning-hub-development --timeout=5m
      - name: Deploy immutable release to k3d
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw release/release-manifest.json | ConvertFrom-Json
          helm upgrade --install learning-hub deploy/charts/learning-hub `
            --namespace learning-hub-development --create-namespace `
            --server-side=true --force-conflicts --rollback-on-failure --wait --timeout 10m `
            --set-string images.api="$($manifest.images.api.image)@$($manifest.images.api.digest)" `
            --set-string images.aiService="$($manifest.images.'ai-service'.image)@$($manifest.images.'ai-service'.digest)" `
            --set-string images.web="$($manifest.images.web.image)@$($manifest.images.web.digest)" `
            --set-string global.environment=development `
            --set-string config.databaseUrl='${{ vars.DEV_DATABASE_URL }}' `
            --set-string config.oidcIssuerUri='${{ vars.DEV_OIDC_ISSUER_URI }}' `
            --set-string config.oidcJwkSetUri='${{ vars.DEV_OIDC_JWK_SET_URI }}' `
            --set-string config.oidcAudience='${{ vars.DEV_OIDC_AUDIENCE }}' `
            --set-string config.litellmBaseUrl='${{ vars.DEV_LITELLM_BASE_URL }}' `
            --set-string ingress.className=traefik `
            --set-string ingress.host='${{ vars.DEV_INGRESS_HOST }}' `
            --set-string ingress.tls.secretName='${{ vars.DEV_INGRESS_TLS_SECRET }}' `
            --set-string networkPolicy.privateEgressCidrs[0]='${{ vars.DEV_PRIVATE_EGRESS_CIDR }}'
      - name: Verify rollout and ingress
        shell: pwsh
        run: |
          kubectl rollout status deployment/learning-hub-api -n learning-hub-development --timeout=5m
          kubectl rollout status deployment/learning-hub-ai-service -n learning-hub-development --timeout=5m
          kubectl rollout status deployment/learning-hub-web -n learning-hub-development --timeout=5m
          Invoke-WebRequest -SkipCertificateCheck -Uri 'https://${{ vars.DEV_INGRESS_HOST }}:8443/health' | Out-Null
