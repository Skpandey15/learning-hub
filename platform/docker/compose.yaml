name: learning-hub

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learning_hub}
      POSTGRES_USER: ${POSTGRES_USER:-learning_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init-keycloak.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
    networks: [data]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_HTTP_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../keycloak/learning-hub-realm.json:/opt/keycloak/data/import/learning-hub-realm.json:ro
    ports:
      - "8081:8080"
    networks: [edge, data]
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.77.7-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      STUDY_MODEL: ${STUDY_MODEL:-openai/gpt-5-mini}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    networks: [ai]
    restart: unless-stopped

  ai-service:
    build:
      context: ../../apps/ai-service
    environment:
      ENVIRONMENT: local
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_AI_SERVICE_TOKEN:?Set INTERNAL_AI_SERVICE_TOKEN in .env}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      STUDY_MODEL: ${STUDY_MODEL:-openai/gpt-5-mini}
    depends_on: [litellm]
    networks: [application, ai]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-learning_hub}
      POSTGRES_USER: ${POSTGRES_USER:-learning_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OIDC_ISSUER_URI: http://keycloak:8080/realms/learning-hub
      AI_SERVICE_BASE_URL: http://ai-service:8000
      INTERNAL_AI_SERVICE_TOKEN: ${INTERNAL_AI_SERVICE_TOKEN:?Set INTERNAL_AI_SERVICE_TOKEN in .env}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      ai-service:
        condition: service_started
    ports:
      - "8080:8080"
    networks: [edge, application, data]
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
    depends_on: [api]
    ports:
      - "3000:8080"
    networks: [edge]
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]

networks:
  edge: {}
  application:
    internal: true
  ai:
    internal: true
  data:
    internal: true

volumes:
  postgres-data: {}
