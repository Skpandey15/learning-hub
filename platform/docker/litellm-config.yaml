model_list:
  - model_name: study-model
    litellm_params:
      model: os.environ/STUDY_MODEL
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: false

litellm_settings:
  request_timeout: 60
  num_retries: 1
  drop_params: true
  set_verbose: false
