[project]
name = "learning-hub-ai-service"
version = "0.1.0"
description = "Internal AI content generation service for Learning Hub"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "msgpack==1.2.1",
  "pydantic-settings==2.15.0",
  "uvicorn[standard]==0.52.1",
]

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
]

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-branch --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=95"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
