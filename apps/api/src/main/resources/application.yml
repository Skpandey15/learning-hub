spring:
  application:
    name: learning-hub-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/learning_hub}
    username: ${POSTGRES_USER:learning_hub}
    password: ${POSTGRES_PASSWORD:learning_hub}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/learning-hub}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
