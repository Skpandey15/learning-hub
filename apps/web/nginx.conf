log_format learning_hub_json escape=json '{'
    '"@timestamp":"$time_iso8601",'
    '"service.name":"learning-hub-web",'
    '"event.action":"http_request",'
    '"http.request.method":"$request_method",'
    '"url.path":"$uri",'
    '"http.response.status_code":$status,'
    '"http.response.body.bytes":$body_bytes_sent,'
    '"event.duration_seconds":$request_time,'
    '"request.id":"$request_id"'
  '}';

access_log /dev/stdout learning_hub_json;
error_log /dev/stderr warn;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:8080 http://localhost:8081; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
